<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b1d">
<meta name="color-scheme" content="dark">
<title>Calendário EMED 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EMED 2027">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:300 600;font-display:swap;src:url(fonts/pjs-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:300 600;font-display:swap;src:url(fonts/pjs-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#070b1d; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.12); --field:rgba(255,255,255,.4); --txt:#eef1ff; --mut:#98a2c6;
  --blue:#4a97ff; --orange:#ff8a1f; --ink:#0a1030; --grad:linear-gradient(120deg,#4a97ff,#8d6bff 50%,#ff8a1f);
  --c-manha:#2ee6a6; --c-tarde:#6f8cff; --c-pa:#ff5ca8; --c-fer:#ff5468; --c-inst:#b583ff; --c-prof:#ffb21f;
  --r:18px; --f:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --glass:inset 0 1px 0 rgba(255,255,255,.07),0 12px 32px rgba(0,0,0,.22);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--txt);font-family:var(--f);font-weight:400;font-size:15px;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--txt)}
::placeholder{color:var(--mut);opacity:1}
b,strong{font-weight:600}
a{color:inherit;text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:#fff;color:#000;padding:8px 14px;border-radius:10px;font-weight:600}
.skip:focus{left:12px}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 700px at 80% -10%,#101a42 0,transparent 60%),var(--bg)}
.blobs i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.2;animation:float 26s ease-in-out infinite}
.blobs i:nth-child(1){width:520px;height:520px;background:#1f6dff;left:-120px;top:120px}
.blobs i:nth-child(2){width:460px;height:460px;background:#ff7a1a;right:-100px;top:420px;animation-delay:-8s;opacity:.15}
.blobs i:nth-child(3){width:380px;height:380px;background:#7b3cff;left:40%;bottom:-160px;animation-delay:-15s;opacity:.17}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-50px)}}

/* ---------- topo ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(7,11,29,.78);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:12px;border-radius:12px;transition:.3s}
.brand:hover{opacity:.85}
.logo{background:#fff;border-radius:12px;padding:6px 10px;display:flex}
.logo img{height:28px;display:block}
.title{font-weight:600;font-size:19px;letter-spacing:-.01em;line-height:1}
.title small{display:block;font-weight:400;font-size:10.5px;color:var(--mut);letter-spacing:1.8px;margin-top:5px}
.title b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav.tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:999px;margin-left:auto}
nav.tabs button{padding:8px 20px;border-radius:999px;font-weight:500;color:var(--mut);transition:.35s}
nav.tabs button:hover{color:#fff}
nav.tabs button.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.actions{display:flex;gap:10px;align-items:center}
.btn{padding:9px 15px;border-radius:12px;font-weight:500;border:1px solid var(--line);background:var(--card);transition:.3s}
.btn:hover{background:var(--card2);transform:translateY(-1px)}
.btn.ghost{background:none}
.btn.cta{background:linear-gradient(120deg,#ff8a1f,#ff6a3d);border:0;color:var(--ink);font-weight:600;box-shadow:0 6px 18px rgba(255,120,40,.28)}
.btn.cta:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 12px;font-size:13px}
.coordtag{padding:7px 12px;border-radius:999px;border:1px solid var(--c-prof);color:var(--c-prof);font-size:12.5px;font-weight:500}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 8px);background:#141b3d;border:1px solid var(--line);border-radius:14px;padding:6px;min-width:240px;display:none;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:20}
.menu.open .pop{display:block;animation:pop .25s ease}
.pop button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
.pop button:hover{background:var(--card2)}
.pop small{display:block;color:var(--mut);font-size:12px}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.backrow{padding-top:14px}
.fab,.bottomnav{display:none}

/* ---------- filtros ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:16px 0 4px}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qa{display:flex;gap:2px;margin-right:6px;padding-right:10px;border-right:1px solid var(--line)}
.qa button{padding:6px 10px;border-radius:8px;font-size:12.5px;color:var(--mut)}
.qa button:hover{color:#fff;background:var(--card)}
.lg{display:flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;transition:.3s;white-space:nowrap}
.lg i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.lg.off{opacity:.62;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.5)}
.lg.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.lg:hover{background:var(--card2)}
.lg.ambos i{background:linear-gradient(135deg,var(--c-manha) 50%,var(--c-tarde) 50%)}
.search{margin-left:auto;display:flex;gap:8px}
.search input,.search select{background:var(--card);border:1px solid var(--field);border-radius:12px;padding:8px 13px;outline:0;min-width:170px}
.search input{min-width:280px}
.search select option,.search select optgroup{background:#141b3d}
.search input:focus,.search select:focus{border-color:var(--blue)}

/* ---------- cores por tipo ---------- */
.manha{--c:var(--c-manha)}.tarde{--c:var(--c-tarde)}.pa{--c:var(--c-pa)}.fer{--c:var(--c-fer)}.inst{--c:var(--c-inst)}.prof{--c:var(--c-prof)}.ambos{--c:var(--c-manha)}
.chip{position:relative;display:block;width:100%;text-align:left;font-size:11.5px;font-weight:500;line-height:1.25;padding:4px 7px 4px 12px;border-radius:8px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:#fff;transition:.3s;--bar:var(--c)}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar)}
.chip:hover{background:color-mix(in srgb,var(--c) 30%,transparent);transform:translateX(3px)}
.chip.ambos{--bar:linear-gradient(180deg,var(--c-manha) 50%,var(--c-tarde) 50%);background:linear-gradient(105deg,color-mix(in srgb,var(--c-manha) 26%,transparent) 0 50%,color-mix(in srgb,var(--c-tarde) 26%,transparent) 50% 100%)}
.chip.ambos:hover{filter:brightness(1.25)}
.chip .g{opacity:.9;margin-right:4px}
.star{color:var(--c-prof);margin-right:3px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.dot.ambos{background:linear-gradient(135deg,var(--c-manha) 50%,var(--c-tarde) 50%)}

/* ---------- mês ---------- */
main{padding:6px 0 40px;outline:0}
.view{display:none}.view.on{display:block;animation:fadeUp .8s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
.mhead{display:flex;align-items:center;gap:12px;margin:14px 0}
.mhead h2{font-weight:500;font-size:30px;letter-spacing:-.02em;min-width:250px}
.mhead h2 span{color:var(--mut);font-weight:300}
.circ{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;transition:.3s}
.circ:hover{background:var(--card2);transform:scale(1.08)}
.bimbar{margin-left:auto;font-size:13px;color:var(--mut)}
.bimbar b{color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid.swapL{animation:swL .55s ease}.grid.swapR{animation:swR .55s ease}
@keyframes swL{from{opacity:0;transform:translateX(40px)}}@keyframes swR{from{opacity:0;transform:translateX(-40px)}}
.dow{font-weight:500;font-size:11.5px;letter-spacing:1.6px;color:var(--mut);text-align:center;padding:6px 0}
.cell{min-height:114px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:7px 7px 8px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.cell:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22)}
.cell.out{opacity:.25;pointer-events:none}
.cell.we{background:rgba(255,255,255,.018)}
.cell.isfer{background:linear-gradient(160deg,rgba(255,84,104,.17),rgba(255,84,104,.04))}
.cell.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange),0 0 22px rgba(255,138,31,.22)}
.num{display:flex;justify-content:space-between}
.dnum{font-weight:500;font-size:14px;color:var(--mut);padding:1px 8px 1px 2px;border-radius:8px;min-width:30px;text-align:left}
.dnum:hover{color:#fff}
.today .dnum{background:var(--orange);color:var(--ink);padding:1px 8px;font-weight:600}
.more{font-size:11px;font-weight:500;color:var(--mut);margin-top:4px;padding-left:4px}
.plus{position:absolute;right:7px;bottom:6px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.14);font-size:15px;line-height:22px;text-align:center;opacity:0;transform:scale(.6);transition:.3s}
.cell:hover .plus{opacity:1;transform:scale(1)}
.dots{display:none}

/* ---------- vidro / cartões ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;position:relative;overflow:hidden;backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:var(--glass);transition:border-color .4s}
.card h3{font-size:11.5px;letter-spacing:1.8px;color:var(--mut);font-weight:500;margin-bottom:14px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card:hover{border-color:rgba(255,255,255,.22)}
.card::after,.wd::after,.mini::after,.cell::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(140,170,255,.06),transparent 65%);opacity:0;transition:opacity .5s}
.card:hover::after,.wd:hover::after,.mini:hover::after,.cell:hover::after{opacity:1}

/* ---------- início ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:14px}
.hello{font-size:38px;font-weight:500;line-height:1.1;letter-spacing:-.025em}
.hello em{font-style:normal;font-weight:600;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shine 12s ease-in-out infinite alternate}
@keyframes shine{to{background-position:100% 0}}
.sub{color:var(--mut);margin:10px 0 16px;font-size:15.5px;font-weight:300}
.big{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg);filter:drop-shadow(0 0 8px rgba(123,92,255,.55))}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:url(#gr);stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 2.6s cubic-bezier(.25,.8,.25,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:500}
.stat{font-size:46px;font-weight:300;line-height:1;letter-spacing:-.03em}
.stat small{font-size:16px;color:var(--mut);font-weight:300;margin-left:6px;letter-spacing:0}
.mid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}
.stack{display:grid;gap:18px}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;margin:0 -12px;border-radius:12px;cursor:pointer;transition:.35s}
.item:hover{background:rgba(255,255,255,.06);transform:translateX(6px)}
.item .it{font-weight:500;color:#e6eaff}.item small{color:var(--mut);display:block;font-size:12.5px;font-weight:400}
.item .ib{flex:1;min-width:0}
.item .cd{font-size:12px;color:var(--mut);white-space:nowrap}
.item::after{content:"›";color:var(--mut);opacity:0;transition:.3s;margin-left:-4px}
.item:hover::after,.item:focus-visible::after{opacity:1}
.db{width:46px;flex:none;text-align:center;border-radius:12px;padding:6px 0;background:color-mix(in srgb,var(--c) 16%,transparent);line-height:1.1}
.db b{display:block;font-size:19px;font-weight:500}.db span{font-size:10.5px;letter-spacing:1px;color:var(--mut)}
.empty{color:var(--mut);padding:8px 0;font-weight:400}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:136px;position:relative;overflow:hidden;transition:.35s}
.wd:hover{border-color:rgba(255,255,255,.22)}
.wd.today{border-color:var(--orange);box-shadow:0 0 20px rgba(255,138,31,.18)}
.wd .h{display:block;text-align:left;font-weight:500;font-size:11.5px;color:var(--mut);letter-spacing:1.3px;margin-bottom:4px}
.wd .h b{display:block;font-size:22px;font-weight:500;color:#fff;letter-spacing:0}
.wd.isfer{background:linear-gradient(160deg,rgba(255,84,104,.17),rgba(255,84,104,.04))}
.wc{min-width:0}
.sect{margin:26px 0 0;letter-spacing:1.8px;color:var(--mut);font-size:11.5px;font-weight:500}
.st{animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*150ms)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 3.2s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}

/* ---------- lista ---------- */
.lbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:12px;border:1px solid var(--field);background:rgba(255,255,255,.04);font-weight:500;transition:.3s;font-size:13.5px}
.seg button:hover{background:var(--card2)}
.seg button.on{background:color-mix(in srgb,var(--c,#4a97ff) 28%,transparent);border-color:var(--c,#4a97ff)}
.seg button.ambos.on{background:linear-gradient(105deg,color-mix(in srgb,var(--c-manha) 34%,transparent) 0 50%,color-mix(in srgb,var(--c-tarde) 34%,transparent) 50% 100%);border-color:#cfe}
.lbar .sp{margin-left:auto}
.lh,.lr{display:grid;grid-template-columns:70px 2fr 1.3fr 1fr 120px;gap:14px;align-items:center}
.lh{padding:8px 16px;font-size:11.5px;letter-spacing:1.5px;color:var(--mut)}
.wkh{margin:18px 0 6px;font-size:12.5px;color:var(--mut);letter-spacing:.5px;padding-left:4px}
.lr{position:relative;overflow:hidden;padding:11px 16px;margin-bottom:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:.35s}
.lr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--c))}
.lr.ambos{--bar:linear-gradient(180deg,var(--c-manha) 50%,var(--c-tarde) 50%)}
.lr:hover{background:var(--card2);transform:translateX(5px)}
.lr .d{font-weight:500;line-height:1.05}.lr .d b{display:block;font-size:22px;font-weight:500}.lr .d span{font-size:11px;letter-spacing:1px;color:var(--mut)}
.lr.today .d b{color:var(--orange)}
.lr .m{color:var(--mut);font-size:13.5px}
.lr .t{font-weight:500}.lr .t small{color:var(--mut);font-weight:400;margin-left:8px}
.meta{display:none}

/* ---------- ano ---------- */
.year{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.4s;position:relative;overflow:hidden;text-align:left;display:block;width:100%}
.mini:hover{transform:translateY(-4px);background:var(--card2);border-color:rgba(255,255,255,.22)}
.mini h4{font-size:15px;font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between}
.mini h4 small{color:var(--mut);font-weight:400;font-size:12px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.md{aspect-ratio:1;border-radius:6px;font-size:10px;display:grid;place-items:center;color:var(--mut)}
.md.ev{color:#fff;font-weight:500;background:color-mix(in srgb,var(--c) 36%,transparent)}
.md.ev.ambos{background:linear-gradient(135deg,color-mix(in srgb,var(--c-manha) 40%,transparent) 50%,color-mix(in srgb,var(--c-tarde) 40%,transparent) 50%)}
.md.fer{background:rgba(255,84,104,.42);color:#fff}
.md.today{outline:2px solid var(--orange)}
.bimstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.bimstrip div{border-radius:12px;padding:10px 14px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.bimstrip b{display:block;color:#fff;font-size:14.5px;font-weight:500}

/* ---------- drawer / modal ---------- */
.shade{position:fixed;inset:0;background:rgba(3,5,15,.6);backdrop-filter:blur(4px);z-index:40;display:none}
.shade.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:rgba(15,22,54,.96);backdrop-filter:blur(24px);border-left:1px solid var(--line);z-index:41;padding:26px;overflow:auto;transform:translateX(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);outline:0}
.drawer.on{transform:none}
.drawer h2{font-size:25px;font-weight:500;line-height:1.2;margin:12px 0 6px;letter-spacing:-.01em}
.tag{display:inline-flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--c) 22%,transparent);color:#fff;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:500}
.tag.ambos{background:linear-gradient(105deg,color-mix(in srgb,var(--c-manha) 40%,transparent) 0 50%,color-mix(in srgb,var(--c-tarde) 40%,transparent) 50% 100%)}
.kv{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;margin:18px 0;font-size:14.5px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;font-weight:500}
.x{position:absolute;right:18px;top:18px;width:40px;height:40px;border-radius:50%;background:var(--card)}
.demo{margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(255,178,31,.1);color:var(--c-prof);font-size:13px}
.drow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.ag-ev{position:relative;overflow:hidden;display:flex;gap:10px;align-items:center;padding:10px 14px 10px 18px;margin-bottom:6px;background:var(--card);border-radius:12px;cursor:pointer;transition:.3s}
.ag-ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ag-ev.ambos::before{background:linear-gradient(180deg,var(--c-manha) 50%,var(--c-tarde) 50%)}
.ag-ev:hover{background:var(--card2);transform:translateX(4px)}

<script>
/* =========================== ESTADO / UTIL =========================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
if(typeof ITEMS==='undefined'){
  $('main').innerHTML='<div class="card" style="margin-top:24px"><h3>Arquivos incompletos</h3><p class="sub">O calendário precisa do arquivo <b>data.js</b> ao lado do <b>index.html</b>. Isso acontece quando o arquivo é aberto como anexo ou cópia no celular.</p><p class="sub" style="margin:0">Abra pelo endereço do site: <b>https://emed-campinas.github.io/calendario/</b></p></div>';
  throw new Error('data.js não carregou');
}
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dt=s=>new Date(s+'T00:00:00');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{const d=dt(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const fmtL=s=>{const d=dt(s);return `${DSEM_L[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}`};
const diff=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
const state={view:'inicio',today:iso(new Date()),sim:false,cur:{y:2027,m:0},hidden:new Set(),q:'',turma:'',coord:false,lista:{range:'30',imp:false},dayOpen:null};
/* "hoje" vem do relógio do aparelho. Fora de 2027, as telas usam a data mais próxima dentro do ano para se posicionar. */
const Y0='2027-01-01',Y1='2027-12-31';
const ref=()=>state.today<Y0?Y0:state.today>Y1?Y1:state.today;
const clsOf=it=>it.kind==='ev'?it.turno:it.kind==='pa'?'pa':it.kind;
const ORDER={fer:0,inst:1,prof:2,pa:3,manha:4,tarde:5,ambos:6};
const hist=[];

function matchTurma(it){
  const t=state.turma; if(!t||!['ev','pa'].includes(it.kind))return true;
  if(it.tl&&it.tl.length)return it.tl.includes(t);
  const x=it.turmas||''; if(!x||/todas/i.test(x))return true;
  const code=t.slice(0,2), ano=t[0];
  return x.includes(code)||x.toLowerCase().includes(t.toLowerCase())||new RegExp('(^|\\D)'+ano+'\\s?(º|°)','i').test(x);
}
function visible(it){
  if(state.hidden.has(clsOf(it)))return false;
  if(state.q&&!(it.title+' '+(it.local||'')+' '+(it.prof||'')+' '+(it.turmas||'')).toLowerCase().includes(state.q))return false;
  return matchTurma(it);
}
const onDay=(k,all)=>ITEMS.filter(it=>it.start<=k&&it.end>=k&&(all||visible(it))).sort((a,b)=>ORDER[clsOf(a)]-ORDER[clsOf(b)]||a.title.localeCompare(b.title));
const chip=it=>`<button class="chip ${clsOf(it)}" data-open="${it.id}" title="${esc(it.title)}" aria-label="${esc(it.title)} – ${TIPOS[clsOf(it)]}${it.imp?' – importante':''}">${it.imp?'<span class="star" aria-hidden="true">★</span>':''}${['ev','pa'].includes(it.kind)?`<span class="g" aria-hidden="true">${GL[it.turno]||''}</span>`:''}${esc(it.title)}</button>`;
const shareHTML=()=>`<div class="menu"><button class="btn shareBtn" aria-haspopup="true">Compartilhar ▾</button><div class="pop">
  <button data-share="Imagem (PNG)">🖼️ Imagem<small>Arte limpa, pronta para o e-mail</small></button>
  <button data-share="PDF">📄 PDF<small>Para anexar</small></button>
  <button data-share="Copiar para e-mail">✉️ Copiar para e-mail<small>Cola formatado no Outlook</small></button></div></div>`;
const itemAttrs=it=>`role="button" tabindex="0" data-open="${it.id}" aria-label="${esc(it.title)} – ${TIPOS[clsOf(it)]}, ${fmtL(it.start)}"`;

/* =========================== INÍCIO =========================== */
function monday(s){const d=typeof s==='string'?dt(s):new Date(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function importantList(T){
  const b=BIM.find(x=>x.s<=T&&T<=x.e)||BIM.find(x=>x.s>T)||BIM[3];
  return {b,list:ITEMS.filter(i=>i.imp&&i.end>=T&&i.start<=b.e).sort((x,y)=>x.start.localeCompare(y.start))};
}
function when(it,T){if(it.start<T)return 'em andamento';const n=diff(T,it.start);return n===0?'hoje':n===1?'amanhã':`em ${n} dias`}
const statHTML=n=>`<div class="stat"><span class="cnt" aria-hidden="true" data-to="${n}">0</span><small aria-hidden="true">${n===1?'dia':'dias'}</small><span class="sr-only">${plural(n,'dia','dias')}</span></div>`;
function renderInicio(){
  const T=state.today, pre=T<Y0, post=T>Y1;
  const h=new Date().getHours(), sd=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const hoje=onDay(T,true), evs=hoje.filter(i=>i.kind!=='fer'), fer=hoje.filter(i=>i.kind==='fer');
  const line2=pre?`Faltam ${plural(diff(T,'2027-01-26'),'dia','dias')} para as aulas`:post?'Ano letivo encerrado':fer.length?`Hoje: ${esc(fer[0].title)}`:evs.length?`Hoje tem ${plural(evs.length,'evento','eventos')}`:'Hoje está livre';
  const bim=BIM.find(b=>b.s<=T&&T<=b.e);
  let ringPct=0,ringTxt='',ringSub='';
  if(bim){ringPct=Math.round(diff(bim.s,T)/diff(bim.s,bim.e)*100);ringTxt=`${bim.n}º bimestre`;ringSub=`${plural(diff(T,bim.e),'dia','dias')} para o fechamento (${fmt(bim.e)})`}

/* ---------- seletor de horário: digitar ou arrastar os ponteiros do relógio ---------- */
const COARSE=matchMedia('(pointer:coarse)').matches;
const CLOCK_SVG='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
function parseTime(v){const m=/^\s*(\d{1,2})(?::?(\d{2}))?\s*$/.exec(v||'');if(!m)return null;const h=+m[1],mi=m[2]==null?0:+m[2];if(h>23||mi>59)return null;return pad(h)+':'+pad(mi)}
const timeField=(id,label,val)=>`<div class="fld" id="f_${id}"><label for="${id}">${label}</label><div class="tf"><input class="tin" id="${id}" type="text" inputmode="${COARSE?'none':'numeric'}" autocomplete="off" maxlength="5" placeholder="--:--" value="${esc(val)}" aria-describedby="e_${id}"><button type="button" class="tbtn" data-clock="${id}" aria-label="Escolher ${label.toLowerCase()} no relógio">${CLOCK_SVG}</button></div><div class="err" id="e_${id}" role="alert">Use o formato 14:40.</div></div>`;
let clk=null;
function openClock(id){
  const inp=document.getElementById(id);
  const cur=parseTime(inp.value)||(id==='iH2'&&parseTime($('#iH1').value))||'08:00';
  const [h,m]=cur.split(':').map(Number);
  clk={id,inp,mode:'h',h,m,drag:false};
  let el=$('#clock');
  if(!el){el=document.createElement('div');el.id='clock';el.className='clock';el.setAttribute('role','dialog');el.setAttribute('aria-label','Escolher horário no relógio');document.body.appendChild(el)}
  el.innerHTML=`<div class="ch" id="cch"></div><svg class="dial" id="cdial" viewBox="0 0 232 232" aria-hidden="true"></svg>
   <div class="cf"><button type="button" class="btn sm" data-ctype>⌨ Digitar</button><span><button type="button" class="btn sm" data-cclear>Limpar</button> <button type="button" class="btn cta sm" data-cok>OK</button></span></div>`;
  el.hidden=false;updateClock();
  if(innerWidth>700){const r=inp.getBoundingClientRect();let top=r.bottom+8;if(top+380>innerHeight)top=Math.max(8,r.top-388);el.style.left=Math.min(Math.max(8,r.left),innerWidth-300)+'px';el.style.top=top+'px'}
}
function closeClock(){const el=$('#clock');if(el)el.hidden=true;clk=null}
function updateClock(){
  if(!clk)return;const {h,m,mode}=clk,C=116;
  const pos=(deg,r)=>[C+r*Math.sin(deg*Math.PI/180),C-r*Math.cos(deg*Math.PI/180)];
  let nums='',sel;
  if(mode==='h'){
    for(let i=0;i<12;i++){const [x,y]=pos(i*30,92),[x2,y2]=pos(i*30,58);nums+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}">${i===0?12:i}</text><text class="sm" x="${x2.toFixed(1)}" y="${y2.toFixed(1)}">${pad(i===0?0:i+12)}</text>`}
    sel={ang:(h%12)*30,r:(h===0||h>12)?58:92,txt:pad(h)}
  }else{
    for(let i=0;i<12;i++){const [x,y]=pos(i*30,92);nums+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}">${pad(i*5)}</text>`}
    sel={ang:m*6,r:92,txt:pad(m)}
  }
  const [sx,sy]=pos(sel.ang,sel.r);
  $('#cdial').innerHTML=`<circle class="face" cx="116" cy="116" r="112"/>${nums}<line class="hand" x1="116" y1="116" x2="${sx.toFixed(1)}" y2="${sy.toFixed(1)}"/><circle class="dotc" cx="116" cy="116" r="4"/><circle class="knob" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${sel.r===58?15:19}"/><text class="sel" x="${sx.toFixed(1)}" y="${sy.toFixed(1)}">${sel.txt}</text>`;
  $('#cch').innerHTML=`<button type="button" class="cseg ${mode==='h'?'on':''}" data-cmode="h" aria-label="Horas">${pad(h)}</button><span>:</span><button type="button" class="cseg ${mode==='m'?'on':''}" data-cmode="m" aria-label="Minutos">${pad(m)}</button>`;
  clk.inp.value=pad(h)+':'+pad(m);
  const f=document.getElementById('f_'+clk.id);if(f)f.classList.remove('bad');
}
function dialPoint(e){
  const d=$('#cdial');if(!d||!clk)return;
  const r=d.getBoundingClientRect(),sc=r.width/232,dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  const ang=(Math.atan2(dx,-dy)*180/Math.PI+360)%360,dist=Math.hypot(dx,dy)/sc;

function saveForm(){

  const flag=(sel,cond,focusSel)=>{const f=$(sel);f.classList.toggle('bad',cond);if(cond&&!first)first=focusSel};

  else{

    if(step&&until&&until>start){for(let d=dt(start);iso(d)<=until;d.setDate(d.getDate()+step)){const s=iso(d);ITEMS.push(Object.assign({id:'i'+(++seq)},data,{start:s,end:s}));n++}}

}
